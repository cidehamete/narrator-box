<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Grace</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="app-header">
    <h1 class="app-title">Grace</h1>
    <div class="header-actions">
      <button id="wake-btn" class="wake-btn" aria-label="Wake voice server">
        🔥 <span id="wake-label">Wake</span>
        <span id="wake-dot" class="wake-dot"></span>
      </button>
      <button id="settings-btn" class="icon-btn" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                   a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                   A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                   l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                   A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                   l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                   a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                   l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                   a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Loader overlay ── -->
  <div id="loader" class="overlay loader-overlay">
    <div class="loader-inner">
      <div class="loader-spinner"></div>
      <p id="loader-text">Waking voices…</p>
    </div>
  </div>

  <!-- ── View tabs ── -->
  <nav class="view-tabs">
    <button id="tab-stage" class="view-tab active">Stage</button>
    <button id="tab-street" class="view-tab">Street</button>
  </nav>

  <!-- ── Main content ── -->
  <main class="main-content">
    <div id="stage-view" class="view">
      <div id="pedal-grid" class="pedal-grid">
        <!-- Pedals injected by app.js -->
      </div>
    </div>

    <div id="street-view" class="view hidden">
      <div class="glimpse-composer">
        <p class="composer-hint">Hand Grace a glimpse of the world.</p>
        <div class="composer-row">
          <button id="glimpse-photo-btn" class="btn-secondary sense-btn">📷 Photo</button>
          <button id="glimpse-mic-btn" class="btn-secondary sense-btn">🎙 Speak</button>
          <button id="glimpse-loc-btn" class="btn-secondary sense-btn">📍 Here</button>
        </div>
        <input type="file" id="glimpse-photo-input" accept="image/*" hidden />
        <img id="glimpse-preview" class="glimpse-preview hidden" alt="Glimpse preview" />
        <div id="glimpse-loc-label" class="loc-label hidden"></div>
        <textarea id="glimpse-text" rows="3"
          placeholder="A note, a quote, what the street looks like…"></textarea>
        <button id="glimpse-give" class="btn-primary give-btn">Give to Grace</button>
        <div id="glimpse-status" class="glimpse-status"></div>
      </div>

      <section class="journal-feed">
        <h3 class="feed-title">Her pages</h3>
        <div id="journal-entries"></div>
      </section>
    </div>
  </main>


  <!-- ── Settings overlay ── -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="overlay-card settings-card">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close" class="btn-primary">Save &amp; Close</button>
      </div>

      <section class="settings-section">
        <h3>Voice Server</h3>

        <label class="field-label" for="settings-tts-endpoint">TTS Endpoint URL</label>
        <input type="text" id="settings-tts-endpoint"
               placeholder="https://yourname-narratorbox.hf.space"
               autocomplete="off" spellcheck="false" />

        <label class="field-label" for="settings-tts-token">TTS Auth Token</label>
        <div class="input-row">
          <input type="password" id="settings-tts-token"
                 placeholder="your-secret-token" autocomplete="off" spellcheck="false" />
          <button type="button" id="settings-tts-token-toggle" class="btn-secondary">Show</button>
        </div>
      </section>

      <section class="settings-section">
        <h3>LLM</h3>

        <label class="field-label" for="settings-apikey">Anthropic API Key</label>
        <div class="input-row">
          <input type="password" id="settings-apikey"
                 placeholder="sk-ant-…" autocomplete="off" spellcheck="false" />
          <button type="button" id="settings-apikey-toggle" class="btn-secondary">Show</button>
        </div>

        <label class="field-label" for="settings-model">Model</label>
        <select id="settings-model">
          <option value="claude-haiku-4-5-20251001">Haiku 4.5 (fast)</option>
          <option value="claude-sonnet-4-6">Sonnet 4.6 (smarter)</option>
        </select>

        <label class="field-label" for="settings-stage-length">Her stage length</label>
        <select id="settings-stage-length">
          <option value="1">One sentence — a single aphorism</option>
          <option value="2">Two sentences — brief</option>
          <option value="3">Three sentences</option>
          <option value="4">Four sentences — a small story</option>
          <option value="6">Six sentences — expansive</option>
        </select>

        <label class="field-label">
          Temperature: <span id="settings-temperature-display">0.9</span>
        </label>
        <input type="range" id="settings-temperature" min="0" max="1.5" step="0.05" />
      </section>

      <section class="settings-section">
        <h3>Grace's Memory (GitHub)</h3>

        <label class="field-label" for="settings-gh-token">GitHub token (fine-grained, Contents read/write)</label>
        <div class="input-row">
          <input type="password" id="settings-gh-token"
                 placeholder="github_pat_…" autocomplete="off" spellcheck="false" />
          <button type="button" id="settings-gh-token-toggle" class="btn-secondary">Show</button>
        </div>

        <label class="field-label" for="settings-gh-repo">Repository (owner/name)</label>
        <input type="text" id="settings-gh-repo"
               placeholder="jasonboog/grace-journal" autocomplete="off" spellcheck="false" />

        <label class="field-label" for="settings-gh-branch">Branch</label>
        <input type="text" id="settings-gh-branch" placeholder="main"
               autocomplete="off" spellcheck="false" />

        <label class="field-label" for="settings-gh-path">Folder in repo</label>
        <input type="text" id="settings-gh-path" placeholder="grace"
               autocomplete="off" spellcheck="false" />
      </section>

      <section class="settings-section">
        <h3>Grace</h3>

        <label class="field-label" for="settings-grace-voice">Her voice</label>
        <div class="input-row">
          <select id="settings-grace-voice"></select>
          <button type="button" id="settings-grace-voice-test" class="btn-secondary">Test</button>
        </div>

        <label class="field-label" for="settings-grace-model">Reflection model (journal pages)</label>
        <select id="settings-grace-model">
          <option value="claude-sonnet-4-6">Sonnet 4.6 (recommended)</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5 (faster)</option>
        </select>

        <label class="field-label" for="settings-grace-prompt">Her voice (system prompt)</label>
        <textarea id="settings-grace-prompt" rows="7"></textarea>
      </section>

      <button id="settings-reset" class="btn-danger">Reset to defaults</button>
    </div>
  </div>

  <!-- ── Debug log (hidden by default, tap title 3× to reveal) ── -->
  <div id="debug-panel" class="hidden">
    <div id="debug-header">
      <span>Debug log</span>
      <button id="debug-clear">Clear</button>
    </div>
    <pre id="debug-log"></pre>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
